[general]
n_epochs = 1200
n_inner = 50
eval_every = 120
eval_k = 24
trace_sample_count = 24
trace_attempt_factor = 5
compute_pcd = 0

[env]
num_layers = 30
accept_err = 0.0016
analysis_save_threshold = 0.02
connectivity = linear
max_gate_count = 0

[arch]
lr_theta = 0.008
lr_arch = 0.004
tau_start = 1.0
tau_end = 0.05
K_prime = 3
gate_cost_weight = 0.0

[finetune]
finetune_steps = 1200
lr_finetune = 0.004

[non_local_opt]
method = scipy_each_step
optim_alg = Rotosolve
rotosolve_sweeps = 2
global_batched_rotosolve = 1
parallel_eval_batch_size = 8
