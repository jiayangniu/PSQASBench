# GQE config for L2 LiH 6-qubit (Jordan-Wigner encoding)
# active_electrons = 2 (Li: 2 valence e- in active space, 3 orbitals → 6 qubits JW)

[env]
num_qubits       = 6
accept_err       = 0.0016
active_electrons = 2
# active_orbitals defaults to num_qubits // 2 = 3

[problem]
mol_file = L2_LiH_Equil_6q_geom_0.0_0.0_0.0_0.0_0.0_1.595_jordan_wigner.npz

[model]
seq_len    = 10
train_size = 2048
n_layer    = 6
n_head     = 8
n_embd     = 256

[general]
epochs           = 10000
eval_every       = 100
eval_n_sequences = 500
lr               = 0.0003
