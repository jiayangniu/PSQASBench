[env]
num_qubits = 6
accept_err = 0.0016
analysis_save_threshold = 0.0016
active_electrons = 2
active_orbitals = 3
connectivity = all

[operator_pool]
pool_kind = ucc
include_minus = 0
num_op_times = 3
op_time_min_exp = -2.0
op_time_max_exp = 0.0
op_time_divisor = 160.0

[model]
seq_len = 10
length_mode = uniform
train_size = 1024
n_layer = 6
n_head = 8
n_embd = 256
dropout = 0.1

[training]
training_mode = online
epochs = 1000
lr = 0.00005
batch_splits = 16
eval_every = 200
eval_n_sequences = 50
eval_temperature = 0.001
train_temperature = 1.0
online_sample_count = 250
online_refresh_every = 25
online_temperature_final = 0.05
online_temperature_schedule = linear
replay_buffer_size = 2048
replay_mix_ratio = 0.5
warmup_epochs = 300

[general]
compute_pcd = 0
training_reopt = 1
benchmark_reopt = 1

[non_local_opt]
method = scipy_each_step
optim_alg = COBYLA
global_iters = 100
n_restarts = 1
global_batched_cobyla = 1
parallel_eval_batch_size = 8
