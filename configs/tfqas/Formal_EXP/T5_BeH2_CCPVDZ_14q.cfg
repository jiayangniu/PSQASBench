[general]
compute_pcd = 0

[env]
accept_err = 0.0016
analysis_save_threshold = 0.1
connectivity = all

[search]
n_layers = 100
gate_set = primitive
two_qubit_prob = 0.5
S = 22500
R = 2250
K = 50
n_expr_samples = 2000
n_bins = 75
pipeline = gatewise
n_workers = 4

[non_local_opt]
method = scipy_each_step
optim_alg = Rotosolve
rotosolve_sweeps = 2
global_batched_rotosolve = 1
parallel_eval_batch_size = 8
